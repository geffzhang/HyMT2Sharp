<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hy-MT2 翻译工作台</title>
  <style>
    :root {
      --bg: #1e1e1e; --surface: #252526; --surface2: #2d2d30;
      --border: #3c3c3c; --text: #cccccc; --muted: #858585;
      --accent: #0078d4; --success: #4ec9b0; --danger: #f14c4c;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      --mono: 'SF Mono', Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ffffff; --surface: #f8f8f8; --surface2: #f0f0f0; --border: #e0e0e0; --text: #1e1e1e; --muted: #666666; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font: 13px/1.5 var(--font); background: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 320px; }
    .header { display: flex; align-items: center; gap: 10px; }
    .title { font-size: 14px; font-weight: 600; }
    .subtitle { font-size: 11px; color: var(--muted); }
    .stats { font-size: 11px; color: var(--muted); margin-left: auto; font-family: var(--mono); }
    .controls { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; padding: 10px; background: var(--surface); border-radius: 6px; }
    .control-group { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 180px; }
    .control-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    select { padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font: inherit; width: 100%; }
    select:focus { outline: none; border-color: var(--accent); }
    button { padding: 6px 16px; font: 12px var(--font); border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #1c8ae6; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .panes { display: flex; gap: 8px; flex: 1; min-height: 180px; }
    .pane { flex: 1; display: flex; flex-direction: column; background: var(--surface); border-radius: 6px; overflow: hidden; }
    .pane-header { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .pane-body { flex: 1; padding: 8px 10px; overflow: auto; }
    textarea { width: 100%; height: 100%; min-height: 150px; background: var(--bg); border: none; color: var(--text); font: inherit; resize: vertical; }
    textarea:focus { outline: none; }
    #output { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
    #output.empty { color: var(--muted); font-style: italic; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-bar { font-size: 11px; color: var(--muted); }
    .status-bar.error { color: var(--danger); }
    .status-bar.success { color: var(--success); }
    .swap-btn { padding: 4px 10px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; align-self: center; }
    .swap-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Hy-MT2 翻译工作台</span>
    <span class="subtitle">本地推理 · 离线</span>
    <span class="stats" id="stats"></span>
  </div>
  <div class="controls">
    <div class="control-group">
      <span class="control-label">目标语言</span>
      <select id="targetLang">
        <option value="zh">zh — Chinese</option>
      </select>
    </div>
    <button class="btn-primary" id="translateBtn" onclick="doTranslate()">翻译</button>
  </div>
  <div class="panes">
    <div class="pane">
      <div class="pane-header">原文</div>
      <div class="pane-body">
        <textarea id="sourceText" placeholder="输入或粘贴要翻译的文本…" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="pane">
      <div class="pane-header">译文</div>
      <div class="pane-body">
        <div id="output" class="empty">译文将显示在这里</div>
      </div>
    </div>
  </div>
  <div class="status-bar" id="statusBar">就绪</div>

  <script>
    let languageNames = {};   // code -> display name (from resource, best effort)
    let connected = false;

    const targetSelect = document.getElementById('targetLang');
    const sourceText = document.getElementById('sourceText');
    const outputDiv = document.getElementById('output');
    const statusBar = document.getElementById('statusBar');
    const statsSpan = document.getElementById('stats');
    const translateBtn = document.getElementById('translateBtn');

    // ---- MCP Apps bridge: postMessage JSON-RPC to the host ----
    let nextRequestId = 1;
    const pendingRequests = new Map();
    function sendRequest(method, params) {
      const id = nextRequestId++;
      return new Promise((resolve, reject) => {
        pendingRequests.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params: params || {} }, '*');
      });
    }
    function sendNotification(method, params) {
      window.parent.postMessage({ jsonrpc: '2.0', method, params: params || {} }, '*');
    }

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || msg.jsonrpc !== '2.0') return;
      if (msg.id !== undefined && pendingRequests.has(msg.id)) {
        const { resolve, reject } = pendingRequests.get(msg.id);
        pendingRequests.delete(msg.id);
        msg.error ? reject(new Error(msg.error.message || JSON.stringify(msg.error))) : resolve(msg.result);
        return;
      }
      if (msg.method === 'ui/notifications/tool-input') handleToolInput(msg.params);
      if (msg.method === 'ui/notifications/tool-result') handleToolResult(msg.params);
    });

    // ---- Host notifications ----
    function handleToolInput(params) {
      const args = params.arguments || {};
      if (typeof args.text === 'string' && args.text.trim()) {
        sourceText.value = args.text;
      }
      if (args.targetLanguage) {
        targetSelect.value = args.targetLanguage;
      }
      if (sourceText.value.trim()) doTranslate();
    }

    function handleToolResult(params) {
      const sc = params.structuredContent;
      if (sc && typeof sc.translated_text === 'string') {
        if (sc.text) sourceText.value = sc.text;
        if (sc.target_language) targetSelect.value = sc.target_language;
        renderTranslation(sc);
      }
    }

    // ---- Translation ----
    async function doTranslate() {
      const text = sourceText.value.trim();
      if (!text) { setStatus('请输入要翻译的文本', 'error'); return; }
      const target = targetSelect.value;
      translateBtn.disabled = true;
      setStatus('翻译中…（首次调用含模型加载，可能需要数秒）');
      outputDiv.classList.remove('empty');
      outputDiv.innerHTML = '<span class="spinner"></span>';

      try {
        const result = await sendRequest('tools/call', {
          name: 'translate',
          arguments: { text, targetLanguage: target }
        });
        const sc = result?.structuredContent;
        if (sc && typeof sc.translated_text === 'string') {
          renderTranslation(sc);
          setStatus('完成', 'success');
        } else if (result?.content?.length > 0) {
          const t = result.content.map(c => c.text || '').join('\n');
          renderText(t);
          setStatus('完成（纯文本）', 'success');
        } else if (result?.isError) {
          throw new Error(result.content?.[0]?.text || '翻译失败');
        } else {
          throw new Error('未收到译文');
        }
      } catch (e) {
        setStatus('错误: ' + e.message, 'error');
        outputDiv.classList.add('empty');
        outputDiv.textContent = e.message;
      } finally {
        translateBtn.disabled = false;
      }
    }

    function renderTranslation(sc) {
      renderText(sc.translated_text);
      const u = sc.usage || {}, t = sc.timings || {};
      const parts = [];
      if (u.prompt_tokens != null || u.completion_tokens != null)
        parts.push(`tokens ${u.prompt_tokens ?? '-'}/${u.completion_tokens ?? '-'}`);
      if (t.tokens_per_second != null) parts.push(`${t.tokens_per_second} tok/s`);
      statsSpan.textContent = parts.join(' · ');
    }

    function renderText(text) {
      outputDiv.classList.remove('empty');
      outputDiv.textContent = text;
    }

    function setStatus(msg, type) {
      statusBar.textContent = msg;
      statusBar.className = 'status-bar' + (type ? ` ${type}` : '');
    }

    // ---- Initialization ----
    function populateLanguages(codes) {
      const groups = { core: [], extended: [], regional: [] };
      const known = new Set();
      for (const tier of Object.keys(groups)) {
        for (const l of (languageNames[tier] || [])) { groups[tier].push(l); known.add(l.code); }
      }
      // enum codes not present in the tier data go to an "other" bucket
      const other = codes ? codes.filter(c => !known.has(c)) : [];

      targetSelect.innerHTML = '';
      const addGroup = (label, items) => {
        if (!items.length) return;
        const g = document.createElement('optgroup');
        g.label = label;
        for (const l of items) {
          const opt = document.createElement('option');
          opt.value = l.code;
          opt.textContent = l.name ? `${l.code} — ${l.name}` : l.code;
          g.appendChild(opt);
        }
        targetSelect.appendChild(g);
      };
      addGroup('常用', groups.core);
      addGroup('更多语言', groups.extended);
      addGroup('方言/民族语言', groups.regional);
      addGroup('其他', other.map(c => ({ code: c })));
      if (!targetSelect.options.length) {
        const opt = document.createElement('option');
        opt.value = 'zh'; opt.textContent = 'zh';
        targetSelect.appendChild(opt);
      }
      targetSelect.value = 'zh';
    }

    async function loadLanguageNames() {
      // Best-effort display names via the languages resource
      try {
        const res = await sendRequest('resources/read', { uri: 'data://hymt2/languages' });
        const text = res?.contents?.[0]?.text;
        if (text) {
          const data = JSON.parse(text);
          for (const tier of ['core', 'extended', 'regional']) {
            if (Array.isArray(data[tier])) languageNames[tier] = data[tier];
          }
        }
      } catch (e) { /* display names are optional */ }
    }

    async function initialize() {
      try {
        setStatus('连接中…');
        await sendRequest('ui/initialize', {
          protocolVersion: '2025-06-18',
          capabilities: {},
          clientInfo: { name: 'hymt2-translate-workbench', version: '1.0.0' }
        });
        sendNotification('ui/notifications/initialized', {});
        connected = true;

        await loadLanguageNames();

        // Preferred path: enum values from the tool inputSchema
        let enumCodes = null;
        try {
          const tools = await sendRequest('tools/list', {});
          const tool = (tools?.tools || []).find(t => t.name === 'translate');
          const schema = tool?.inputSchema;
          if (schema) enumCodes = schema.properties?.targetLanguage?.enum;
        } catch (e) { /* fall back to resource-only */ }

        populateLanguages(enumCodes || null);
        setStatus('就绪');
      } catch (e) {
        // Standalone mode (e.g. opened outside an MCP Apps host)
        await loadLanguageNames().catch(() => {});
        populateLanguages(null);
        setStatus('独立模式：' + e.message);
      }
    }

    initialize();
  </script>
</body>
</html>
